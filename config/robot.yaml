# Robot model paths (relative to the workspace root).
# setup.sh downloads h1_2_description from unitreerobotics/unitree_ros into third_party/.
# MJCF is a local copy of unitree_mujoco/unitree_robots/h1_2. It matches the URDF
# (same mass, CoM and CAM; checked by scripts/check_env.py).

robot: unitree_h1_2
urdf: third_party/unitree_ros/robots/h1_2_description/h1_2_handless.urdf
mjcf: assets/h1_2/h1_2_handless.xml   # unitree_mujoco copy (identical to upstream)
scene: assets/h1_2/scene.xml
mesh_dir: assets/h1_2/meshes

# Phase 0 gate tolerances
tolerance:
  mass_kg: 0.01
  com_m: 0.001       # 1 mm
  cam_rel: 0.01      # 1 %
